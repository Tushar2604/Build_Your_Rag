[project]
name = "rag-platform"
version = "0.1.0"
description = "Multi-tenant RAG platform — upload documents, get a working AI chatbot. Free-tier deployable."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # --- Web / API ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1",
    # --- Validation / settings ---
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "email-validator>=2.2",
    # --- Persistence ---
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29",
    "pgvector>=0.3.6",
    "alembic>=1.13",
    # --- Auth / security ---
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    # --- Providers ---
    "openai>=1.40",                # OpenAI: primary LLM generation
    "google-genai>=1.0",          # Gemini: embeddings + Flash generation
    "groq>=0.11",                  # Groq: fast LLM generation
    "boto3>=1.35",                 # Cloudflare R2 (S3-compatible)
    # --- RAG orchestration ---
    "langgraph>=0.2.28",
    "langchain-core>=0.3",
    # --- Document parsing ---
    "pypdf>=5.0",
    "python-docx>=1.1",
    "markdown-it-py>=3.0",
    # --- Reporting ---
    "fpdf2>=2.7",                   # interview report PDF generation
    # --- Resilience / infra ---
    "httpx>=0.27",
    "tenacity>=9.0",
    "structlog>=24.4",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
    "aiosqlite>=0.20",
]
# AI observability — optional; the app runs no-op without these installed.
observability = [
    "langfuse>=2.50",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
]
# MCP connector — optional; only needed to run the MCP server.
mcp = [
    "mcp>=1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "C4", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
