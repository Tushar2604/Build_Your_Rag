# Render Blueprint — one free web service that builds the Dockerfile (frontend
# SPA + FastAPI backend in a single image, served from one origin).
#
# Deploy: push this repo to GitHub, then in Render: New > Blueprint > pick the
# repo. Render reads this file, creates the service, and prompts for the secrets
# marked `sync: false` below. Bring your own free Neon Postgres + Gemini + Groq.
#
# Free plan note: the instance sleeps after ~15 min idle and cold-starts on the
# next request. The app is built for this — ingestion is resumable, so a sleep
# mid-job is picked back up on wake.
services:
  - type: web
    name: rag-platform
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      # Strong secret generated by Render — never commit one.
      - key: JWT_SECRET
        generateValue: true
      # --- Secrets you paste in the dashboard (Render won't store them in git) ---
      - key: DATABASE_URL          # Neon: postgresql://user:pass@host/db?sslmode=require
        sync: false
      - key: OPENAI_API_KEY        # https://platform.openai.com/api-keys (primary)
        sync: false
      - key: GEMINI_API_KEY        # https://aistudio.google.com/app/apikey
        sync: false
      - key: GROQ_API_KEY          # https://console.groq.com/keys
        sync: false
      # Set to your service's public URL after the first deploy so widget/share
      # links resolve (e.g. https://rag-platform.onrender.com).
      - key: APP_BASE_URL
        sync: false
      # --- Optional: Cloudflare R2 for durable uploads (else local-disk, ephemeral) ---
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
